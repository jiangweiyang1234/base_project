# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  # 信任 OpenResty/Nginx 的 X-Forwarded-*，避免 HTTPS 站点重定向成 http:// 触发 Mixed Content
  forward-headers-strategy: framework
  servlet:
    # 应用的访问路径
    context-path: /
  # undertow 配置
  undertow:
    # HTTP post内容的最大大小。当值为-1时，默认值为大小是无限的
    max-http-post-size: 1GB
    # 以下的配置会影响buffer,这些buffer会用于服务器连接的IO操作,有点类似netty的池化内存管理
    # 每块buffer的空间大小,越小的空间被利用越充分
    buffer-size: 512
    # 是否分配的直接内存
    direct-buffers: true
    threads:
      # 设置IO线程数, 它主要执行非阻塞的任务,它们会负责多个连接, 默认设置每个CPU核心一个线程
      io: 8
      # 阻塞任务线程池, 当执行类似servlet请求阻塞操作, undertow会从这个线程池中取得线程,它的值设置取决于系统的负载
      worker: 256

captcha:
  # 是否启用验证码校验
  enable: true
  # 验证码类型 math 数组计算 char 字符验证
  type: math
  # 数字验证码位数
  numberLength: 1
  # 字符验证码长度
  charLength: 4

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  application:
    name: Slion-Service
  threads:
    # 开启虚拟线程 仅jdk21可用
    virtual:
      enabled: false
  task:
    execution:
      # 从 springboot 3.5 开始 spring自带线程池
      # 不再需要 AsyncConfig与ThreadPoolConfig 可直接注入线程池使用
      thread-name-prefix: async-
      # 由spring自己初始化线程池
      mode: force
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: @profiles.active@
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  mvc:
    # 设置静态资源路径 防止所有请求都去查静态资源
    static-path-pattern: /static/**
    format:
      date-time: yyyy-MM-dd HH:mm:ss
  jackson:
    # 日期格式化
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      # 格式化输出
      indent_output: false
      # 忽略无法转换的对象
      fail_on_empty_beans: false
    deserialization:
      # 允许对象忽略json中不存在的属性
      fail_on_unknown_properties: false

# Sa-Token配置
sa-token:
  # token名称 (同时也是cookie名称)
  token-name: Authorization
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
  is-share: false
  # jwt秘钥（务必通过环境变量 SLION_JWT_SECRET 覆盖）
  jwt-secret-key: ${SLION_JWT_SECRET:CHANGE_ME_JWT_SECRET_PLEASE_OVERRIDE}

# security配置
security:
  # 排除路径
  excludes:
    - /*.html
    - /**/*.html
    - /**/*.css
    - /**/*.js
    - /favicon.ico
    - /error
    - /auth/login
    - /auth/code
    - /auth/logout
    - /auth/binding/*
    - /auth/social/callback
    - /register
    - /resource/sms/code
    - /resource/email/code
    - /oauth2/**
    - /open-api/**
    - /.well-known/**
    - /userinfo
    # Warm-Flow 设计器静态资源与配置接口（API 仍走 /warm-flow/** 鉴权）
    - /warm-flow-ui/**

# 多租户配置
tenant:
  # 是否开启（可用环境变量 TENANT_ENABLED 覆盖；开启后才会注册 /system/tenant 等接口）
  enable: ${TENANT_ENABLED:true}
  # 排除表（关联表通常无 tenant_id）
  excludes:
    - sys_menu
    - sys_tenant
    - sys_tenant_package
    - sys_role_dept
    - sys_role_menu
    - sys_user_post
    - sys_user_role
    - sys_client
    - slion_oauth_client
    - oauth2_registered_client
    - sys_oss_config
    - flow_spel

# MyBatisPlus配置
# https://baomidou.com/config/
mybatis-plus:
  # 自定义配置 是否全局开启逻辑删除 关闭后 所有逻辑删除功能将失效
  enableLogicDelete: true
  # 多包名使用 例如 org.dromara.**.mapper,org.xxx.**.mapper
  mapperPackage: net.slion.**.mapper
  # 对应的 XML 文件位置
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: net.slion.**.domain
  global-config:
    dbConfig:
      # 主键类型
      # AUTO 自增 NONE 空 INPUT 用户输入 ASSIGN_ID 雪花 ASSIGN_UUID 唯一 UUID
      # 如需改为自增 需要将数据库表全部设置为自增
      idType: ASSIGN_ID

# 数据加密
mybatis-encryptor:
  # 是否开启加密
  enable: false
  # 默认加密算法
  algorithm: BASE64
  # 编码方式 BASE64/HEX。默认BASE64
  encode: BASE64
  # 安全秘钥 对称算法的秘钥 如：AES，SM4
  password:
  # 公私钥 非对称算法的公私钥 如：SM2，RSA
  publicKey:
  privateKey:

# api接口加密（默认关闭；开发环境见 application-dev.yml，生产用环境变量）
api-decrypt:
  enabled: false
  headerFlag: encrypt-key
  publicKey: ${SLION_API_PUBLIC_KEY:}
  privateKey: ${SLION_API_PRIVATE_KEY:}

springdoc:
  api-docs:
    # 生产环境务必关闭；开发环境可在 profile 中开启
    enabled: false
  info:
    title: 'Slion Service API'
    description: 'Slion 基线服务接口文档'
    version: '${project.version}'
    contact:
      name: Slion
  group-configs:
    - group: 1.通用模块
      packages-to-scan: net.slion.web
    - group: 2.系统模块
      packages-to-scan: net.slion.system
    - group: 3.工作流模块
      packages-to-scan: net.slion.workflow
    - group: 4.OAuth2模块
      packages-to-scan: net.slion.oauth

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接
  excludeUrls:
    - /system/notice

--- # 分布式锁 lock4j 全局配置
lock4j:
  # 获取分布式锁超时时间，默认为 3000 毫秒
  acquire-timeout: 3000
  # 分布式锁的超时时间，默认为 30 秒
  expire: 30000

--- # Actuator 监控端点的配置项
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
    logfile:
      external-file: ./logs/sys-console.log

--- # SSE 推送（按需开启）
sse:
  enabled: false
  path: /resource/sse

--- # websocket
websocket:
  enabled: false
  path: /resource/websocket
  allowedOrigins: ${SLION_WS_ORIGINS:http://localhost:8080}

--- # warm-flow工作流配置
warm-flow:
  # 是否开启（可用环境变量 WARM_FLOW_ENABLED 覆盖；开启后才会注册 /workflow/** 接口）
  enabled: ${WARM_FLOW_ENABLED:true}
  ui: true
  top-text-show: true
  node-tooltip: true
  token-name: ${sa-token.token-name},clientid
  features:
    cancel-enabled: true
    transfer-enabled: true
    delegate-enabled: true
    copy-enabled: true
    spel-manage-enabled: true

--- # OAuth2 / Disruptor 等扩展能力
oauth2:
  enabled: ${OAUTH2_ENABLED:false}
  # 对外访问根地址（与 OpenResty 同域一致，勿带末尾 /）
  issuer: ${OAUTH2_ISSUER:http://localhost:8080}
  # 以下仅在 slion_oauth_client 空表时写入一条种子；正式请用管理台「开放应用」
  client-id: ${OAUTH2_CLIENT_ID:}
  client-secret: ${OAUTH2_CLIENT_SECRET:}
  scope: ${OAUTH2_SCOPE:open.api}

disruptor:
  enabled: false

--- # slion 可配置基础设施
slion:
  redis:
    enabled: true
  oss:
    enabled: true
  sms:
    enabled: false
  social:
    enabled: false
  gateway:
    enabled: false
    tcp:
      port: 9031
      boss-threads: 1
      worker-threads: 2
      max-frame-bytes: 1048576
      idle-seconds: 60

kafka:
  enabled: false
  bootstrap-servers: localhost:9092
  client-id: slion-service
  producer:
    acks: all
    retries: 3
  consumer:
    group-id: slion-group
    auto-offset-reset: earliest
    concurrency: 3
