server {
    listen 80;
    server_name _;
    client_max_body_size 100m;

    root /usr/share/nginx/html;
    index index.html;

    # 后端 API（与 .env.production 中 VUE_APP_BASE_URL=/prod-api 对齐）
    location /prod-api/ {
        proxy_pass http://slion-admin:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header clientid $http_clientid;
        proxy_set_header encrypt-key $http_encrypt_key;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Warm-Flow 设计器静态页（勿走 SPA try_files，否则 JS 会拿到 index.html）
    location = /warm-flow-ui/ {
        proxy_pass http://slion-admin:8080/warm-flow-ui/index.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header clientid $http_clientid;
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "SAMEORIGIN" always;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location /warm-flow-ui/ {
        proxy_pass http://slion-admin:8080/warm-flow-ui/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header clientid $http_clientid;
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "SAMEORIGIN" always;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Warm-Flow 设计器 API（相对路径 ../warm-flow/）
    location /warm-flow/ {
        proxy_pass http://slion-admin:8080/warm-flow/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header clientid $http_clientid;
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "SAMEORIGIN" always;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
