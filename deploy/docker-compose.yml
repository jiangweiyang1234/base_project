# Slion 基线部署栈：postgres + redis + admin + web(nginx)
# 用法（仓库根目录）：
#   cp deploy/.env.example deploy/.env
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#
# 可选 Kafka：
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.kafka.yml --env-file deploy/.env up -d

services:
  postgres:
    image: postgres:15
    container_name: slion-postgres
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: ${SLION_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${SLION_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${SLION_DB_NAME:-slion}
    ports:
      - "${SLION_PG_HOST_PORT:-5432}:5432"
    volumes:
      - slion-pg-data:/var/lib/postgresql/data
      - ../scripts/sql/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SLION_DB_USER:-postgres} -d ${SLION_DB_NAME:-slion}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - slion-net

  redis:
    image: redis:7
    container_name: slion-redis
    restart: unless-stopped
    command: >
      redis-server --appendonly yes
      --requirepass ${SLION_REDIS_PASSWORD:-slion_redis_pass}
    ports:
      - "${SLION_REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - slion-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SLION_REDIS_PASSWORD:-slion_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - slion-net

  slion-admin:
    build:
      context: ../SlionService/slion-admin
      dockerfile: Dockerfile.runtime
    container_name: slion-admin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${SLION_DB_NAME:-slion}?useUnicode=true&characterEncoding=utf8&reWriteBatchedInserts=true
      DB_USERNAME: ${SLION_DB_USER:-postgres}
      DB_PASSWORD: ${SLION_DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${SLION_REDIS_PASSWORD:-slion_redis_pass}
      SLION_JWT_SECRET: ${SLION_JWT_SECRET:-CHANGE_ME_JWT_SECRET}
      SLION_API_PUBLIC_KEY: ${SLION_API_PUBLIC_KEY:-}
      SLION_API_PRIVATE_KEY: ${SLION_API_PRIVATE_KEY:-}
    ports:
      - "${SLION_ADMIN_HOST_PORT:-8080}:8080"
    networks:
      - slion-net

  slion-web:
    image: nginx:1.27-alpine
    container_name: slion-web
    restart: unless-stopped
    depends_on:
      - slion-admin
    ports:
      - "${SLION_WEB_HOST_PORT:-80}:80"
    volumes:
      - ./conf/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../SlionWeb/dist:/usr/share/nginx/html:ro
    networks:
      - slion-net

networks:
  slion-net:
    driver: bridge

volumes:
  slion-pg-data:
  slion-redis-data:
