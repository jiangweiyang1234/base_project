# Slion 基线一键部署：中间件 + 后端(镜像内 Maven) + 前端(镜像内 pnpm)
# 用法：./start.sh   或   docker compose --env-file .env up -d --build
#
# 可选 Kafka：
#   ./start.sh --with-kafka

name: slion-service

services:
  postgres:
    image: docker.1ms.run/postgres:15
    container_name: slion-service-postgres
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: ${SLION_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${SLION_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${SLION_DB_NAME:-slion}
    ports:
      - "${SLION_PG_HOST_PORT:-5432}:5432"
    volumes:
      - slion-pg-data:/var/lib/postgresql/data
      - ../scripts/sql/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SLION_DB_USER:-postgres} -d ${SLION_DB_NAME:-slion}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - slion-service-net

  redis:
    image: docker.1ms.run/redis:8.0
    container_name: slion-service-redis
    restart: unless-stopped
    command: >
      redis-server --appendonly yes
      --requirepass ${SLION_REDIS_PASSWORD:-slion_redis_pass}
    ports:
      - "${SLION_REDIS_HOST_PORT:-26379}:6379"
    volumes:
      - slion-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SLION_REDIS_PASSWORD:-slion_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - slion-service-net

  # 对象存储（系统管理 → 上传文件 / OSS）
  # 使用测试机已有镜像 docker.1ms.run/minio/minio:latest-cicd（内含 mc，无需另拉 mc 镜像）
  minio:
    image: docker.1ms.run/minio/minio:latest-cicd
    container_name: slion-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ruoyi}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ruoyi123}
    ports:
      - "${SLION_MINIO_API_PORT:-9000}:9000"
      - "${SLION_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - slion-minio-data:/data
    networks:
      - slion-service-net

  # 初始化默认桶 ruoyi（与 sys_oss_config 种子一致）
  # 一次性任务：成功后状态为 Exited(0)，属正常，不是失败
  minio-init:
    image: docker.1ms.run/minio/minio:latest-cicd
    container_name: slion-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        USER="$${MINIO_ROOT_USER:-ruoyi}"
        PASS="$${MINIO_ROOT_PASSWORD:-ruoyi123}"
        BUCKET="$${MINIO_BUCKET:-ruoyi}"
        echo "[minio-init] waiting for minio API..."
        i=0
        until mc alias set local http://minio:9000 "$$USER" "$$PASS" >/dev/null 2>&1; do
          i=$$((i + 1))
          if [ "$$i" -gt 60 ]; then
            echo "[minio-init] timeout waiting for minio"
            exit 1
          fi
          echo "[minio-init] not ready, retry $$i/60..."
          sleep 2
        done
        echo "[minio-init] alias ok, ensure bucket..."
        mc mb -p "local/$$BUCKET" >/dev/null 2>&1 || true
        mc anonymous set download "local/$$BUCKET" >/dev/null 2>&1 || true
        mc ls "local/$$BUCKET" >/dev/null
        echo "[minio-init] bucket ready: $$BUCKET"
        exit 0
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ruoyi}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ruoyi123}
      MINIO_BUCKET: ${MINIO_BUCKET:-ruoyi}
    networks:
      - slion-service-net
    restart: "no"

  slion-admin:
    build:
      context: ../SlionService
      dockerfile: slion-admin/Dockerfile
    image: slion/slion-admin:${IMAGE_TAG:-1.0.0}
    container_name: slion-admin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}
      DB_URL: jdbc:postgresql://postgres:5432/${SLION_DB_NAME:-slion}?useUnicode=true&characterEncoding=utf8&reWriteBatchedInserts=true
      DB_USERNAME: ${SLION_DB_USER:-postgres}
      DB_PASSWORD: ${SLION_DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${SLION_REDIS_PASSWORD:-slion_redis_pass}
      SLION_JWT_SECRET: ${SLION_JWT_SECRET:-CHANGE_ME_JWT_SECRET}
      # API 请求体加解密（RSA+AES；前端需 loginRSA=true 且公钥一致）
      SLION_API_DECRYPT_ENABLED: ${SLION_API_DECRYPT_ENABLED:-true}
      SLION_API_PUBLIC_KEY: ${SLION_API_PUBLIC_KEY:-}
      SLION_API_PRIVATE_KEY: ${SLION_API_PRIVATE_KEY:-}
      # OAuth2 开放 API（默认关闭；issuer 与 OpenResty 同域根地址一致）
      # 客户端 AppKey/AppSecret 在管理台「开放应用」维护；下列 CLIENT_* 仅空库种子
      OAUTH2_ENABLED: ${OAUTH2_ENABLED:-false}
      OAUTH2_ISSUER: ${OAUTH2_ISSUER:-http://127.0.0.1:28080}
      OAUTH2_CLIENT_ID: ${OAUTH2_CLIENT_ID:-}
      OAUTH2_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET:-}
      OAUTH2_SCOPE: ${OAUTH2_SCOPE:-open.api}
      # 多租户 / 工作流（关闭时对应 Controller 不会注册，前端菜单会 404）
      TENANT_ENABLED: ${TENANT_ENABLED:-true}
      WARM_FLOW_ENABLED: ${WARM_FLOW_ENABLED:-true}
    ports:
      - "${SLION_ADMIN_HOST_PORT:-28080}:8080"
    networks:
      - slion-service-net

  slion-web:
    build:
      context: ../SlionWeb
      dockerfile: Dockerfile
      args:
        # 授权密钥请放在 SlionWeb/.env.local，勿在此传入 preview（会阻断打包）
        VUE_APP_BASE_URL: ${VUE_APP_BASE_URL:-/prod-api}
        VUE_APP_CLIENT_ID: ${VUE_APP_CLIENT_ID:-e5cd7e4891bf95d1d19206ce24a7b32e}
        VUE_APP_RSA_PUBLIC_KEY: ${SLION_API_PUBLIC_KEY:-}
    image: slion/slion-web:${IMAGE_TAG:-1.0.0}
    container_name: slion-web
    restart: unless-stopped
    depends_on:
      - slion-admin
    ports:
      - "${SLION_WEB_HOST_PORT:-280}:80"
    networks:
      - slion-service-net

networks:
  slion-service-net:
    name: slion-service-net
    driver: bridge

volumes:
  slion-pg-data:
  slion-redis-data:
  slion-minio-data:
