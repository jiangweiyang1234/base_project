# 开发辅助栈：仅基础设施（postgres + redis），应用本地启动
#   ./deploy/start.sh --dev
#   docker compose -f deploy/docker-compose.dev.yml --env-file deploy/.env up -d

services:
  postgres:
    image: docker.1ms.run/postgres:15
    container_name: slion-dev-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${SLION_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${SLION_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${SLION_DB_NAME:-slion}
    volumes:
      - slion-dev-pg:/var/lib/postgresql/data
      - ../scripts/sql/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - slion-service-net

  redis:
    image: docker.1ms.run/redis:8.0
    container_name: slion-dev-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${SLION_REDIS_PASSWORD:-}
    networks:
      - slion-service-net

networks:
  slion-service-net:
    name: slion-service-net
    driver: bridge

volumes:
  slion-dev-pg:
