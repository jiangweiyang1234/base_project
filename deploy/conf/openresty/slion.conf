# OpenResty 同域反代：Web + Admin(/prod-api) + OAuth2/开放 API
# 用法：复制到 openresty vhost 后改 server_name，再 openresty -t && openresty -s reload
#
# 同一域名流量划分：
#   /                 -> 127.0.0.1:280     slion-web 静态页
#   /prod-api/        -> 127.0.0.1:28080   管理端 API（去掉前缀）
#   /warm-flow-ui/    -> 127.0.0.1:28080   Warm-Flow 设计器静态资源
#   /warm-flow/       -> 127.0.0.1:28080   Warm-Flow 设计器 API
#   /oauth2/          -> 127.0.0.1:28080   OAuth2 协议（路径不改写）
#   /open-api/        -> 127.0.0.1:28080   开放业务 API
#   /.well-known/     -> 127.0.0.1:28080   OIDC 发现
#   /userinfo         -> 127.0.0.1:28080
#
# 前提：http {} 中已有
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }

upstream slion_web {
    server 127.0.0.1:280;
    keepalive 16;
}

upstream slion_admin {
    server 127.0.0.1:28080;
    keepalive 16;
}

# 若外层已有 HTTPS 终结，优先沿用其 X-Forwarded-Proto，避免后端重定向成 http://
map $http_x_forwarded_proto $slion_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    # listen 443 ssl http2;
    server_name slion.hxsoft.net;   # 改成实际域名

    # ssl_certificate     /usr/local/openresty/nginx/conf/ssl/slion.hxsoft.net.crt;
    # ssl_certificate_key /usr/local/openresty/nginx/conf/ssl/slion.hxsoft.net.key;

    client_max_body_size 20m;
    access_log logs/slion.access.log;
    error_log  logs/slion.error.log;

    # ---------- 管理端 API：与前端 VUE_APP_BASE_URL=/prod-api 对齐 ----------
    location /prod-api/ {
        proxy_pass http://slion_admin/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $slion_forwarded_proto;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header clientid          $http_clientid;
        proxy_set_header encrypt-key       $http_encrypt_key;
        proxy_set_header Connection        "";
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    # ---------- Warm-Flow 设计器（须在 SPA / 之前，直连 admin） ----------
    # 目录访问统一落到 index.html，避免后端对 /warm-flow-ui/ 返回 500 JSON
    location = /warm-flow-ui {
        return 301 /warm-flow-ui/index.html;
    }
    location = /warm-flow-ui/ {
        proxy_pass http://slion_admin/warm-flow-ui/index.html;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $slion_forwarded_proto;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header clientid          $http_clientid;
        proxy_set_header Connection        "";
        # 兼容未升级 admin 时仍被 DENY 的情况
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "SAMEORIGIN" always;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    location /warm-flow-ui/ {
        proxy_pass http://slion_admin;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $slion_forwarded_proto;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header clientid          $http_clientid;
        proxy_set_header Connection        "";
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "SAMEORIGIN" always;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    location /warm-flow/ {
        proxy_pass http://slion_admin;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $slion_forwarded_proto;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header clientid          $http_clientid;
        proxy_set_header Connection        "";
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "SAMEORIGIN" always;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    # ---------- OAuth2 协议 / 开放 API（直连 admin，勿加 /prod-api） ----------
    location /oauth2/ {
        proxy_pass http://slion_admin;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $slion_forwarded_proto;
        proxy_set_header Connection        "";
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    location /open-api/ {
        proxy_pass http://slion_admin;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $slion_forwarded_proto;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header Connection        "";
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    location /.well-known/ {
        proxy_pass http://slion_admin;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $slion_forwarded_proto;
        proxy_set_header Connection        "";
    }

    location = /userinfo {
        proxy_pass http://slion_admin;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $slion_forwarded_proto;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header Connection        "";
    }

    # ---------- 管理后台前端 SPA ----------
    location / {
        proxy_pass http://slion_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $slion_forwarded_proto;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
