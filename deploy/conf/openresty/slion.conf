# OpenResty / Nginx 宿主机反代样例
# 用法：复制到 openresty vhost 目录后改 server_name，再 openresty -t && openresty -s reload
#
# 流量：
#   /                 -> 127.0.0.1:280     (slion-web，内含 /prod-api 反代)
#   /oauth2/          -> 127.0.0.1:28080   (OAuth2 协议，路径不改写)
#   /open-api/        -> 127.0.0.1:28080   (开放业务 API)
#   /.well-known/     -> 127.0.0.1:28080   (OIDC 发现)
#   /userinfo         -> 127.0.0.1:28080
#
# 前提：http {} 中已有
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }

upstream slion_web {
    server 127.0.0.1:280;
    keepalive 16;
}

upstream slion_admin {
    server 127.0.0.1:28080;
    keepalive 16;
}

server {
    listen 80;
    # listen 443 ssl http2;
    server_name test-slion.example.com;   # 改成实际域名或 IP

    # ssl_certificate     /usr/local/openresty/nginx/conf/ssl/test-slion.crt;
    # ssl_certificate_key /usr/local/openresty/nginx/conf/ssl/test-slion.key;

    client_max_body_size 20m;
    access_log logs/slion.access.log;
    error_log  logs/slion.error.log;

    # ---------- OAuth2 / 开放 API：直连 admin，勿加 /prod-api 前缀 ----------
    location /oauth2/ {
        proxy_pass http://slion_admin;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    location /open-api/ {
        proxy_pass http://slion_admin;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header Connection        "";
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    location /.well-known/ {
        proxy_pass http://slion_admin;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    location = /userinfo {
        proxy_pass http://slion_admin;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header Connection        "";
    }

    # ---------- 管理后台 Web（容器内已反代 /prod-api） ----------
    location / {
        proxy_pass http://slion_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
